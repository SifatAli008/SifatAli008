# Daily auto blog at 8:30 PM Asia/Dhaka (14:30 UTC).
# Generates article with Gemini, commits to main, optional Firestore sync.
name: Daily auto blog post

on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-auto-blog
  cancel-in-progress: false

jobs:
  publish-daily-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate daily article
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
          OPENROUTER_MODEL: openrouter/free
        run: npm run daily:article

      - name: Publish to Firestore
        if: steps.generate.outcome == 'success' && steps.generate.outputs.article_slug != ''
        env:
          FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
        run: |
          if [ -z "$FIREBASE_ADMIN_PROJECT_ID" ] || [ -z "$FIREBASE_ADMIN_CLIENT_EMAIL" ] || [ -z "$FIREBASE_ADMIN_PRIVATE_KEY" ]; then
            echo "Firestore admin secrets not set — skipping Firestore publish (codebase fallback still works)."
            exit 0
          fi
          npm run publish:article -- --slug=${{ steps.generate.outputs.article_slug }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/articles src/lib/data/article-faqs.ts src/lib/data/blog-meta.ts src/lib/data/blog-fallback.ts
          if git diff --staged --quiet; then
            echo "No file changes to commit (article may already exist for today)."
            exit 0
          fi
          git commit -m "chore: publish daily tech article (${{ steps.generate.outputs.article_slug }})"
          git push
