# Fires daily at 8:30 PM Asia/Dhaka (14:30 UTC).
# Creates a tracking issue so a Cursor Cloud / scheduled agent (or you)
# can run the daily-tech-article skill and publish.
name: Daily article trigger

on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  open-daily-article-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create daily article issue
        uses: actions/github-script@v7
        with:
          script: |
            const dhaka = new Date().toLocaleString("en-CA", {
              timeZone: "Asia/Dhaka",
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
            });
            const title = `Daily tech article — ${dhaka} (8:30 PM Asia/Dhaka)`;
            const body = [
              "## Autonomous publish task",
              "",
              "Run the project skill **daily-tech-article** and ship ONE verified long-form post.",
              "",
              "### Agent instructions",
              "1. Research today's verifiable tech developments.",
              "2. Write the article under `src/lib/data/articles/`.",
              "3. Sync FAQs in `src/lib/data/article-faqs.ts` and meta in `src/lib/data/blog-meta.ts`.",
              "4. Register in `src/lib/data/articles/index.ts`.",
              "5. Try `npm.cmd run publish:article -- --slug=<slug>` if Firebase Admin env is available.",
              "",
              "Skill path: `.cursor/skills/daily-tech-article/SKILL.md`",
              "",
              `Window: 8:30 PM Asia/Dhaka · date ${dhaka}`,
            ].join("\n");

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "daily-article",
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "daily-article",
                color: "FF3B00",
                description: "Daily 8:30 PM Asia/Dhaka article publish task",
              });
            }

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "daily-article",
              per_page: 10,
            });
            const already = existing.data.find((i) => i.title === title);
            if (already) {
              core.info(`Issue already open: #${already.number}`);
              return;
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["daily-article"],
            });
            core.info(`Opened #${issue.data.number}`);
